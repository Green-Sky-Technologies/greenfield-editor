<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Greenfield</title>
  <link rel="icon" type="image/svg+xml" href="greenfield-favicon.svg">
  <link data-trunk rel="copy-file" href="greenfield-favicon.svg" />
  <link data-trunk rel="copy-file" href="greenfield-mark-small.svg" />
  <link data-trunk rel="copy-file" href="greenfield-mark-small-on-light.svg" />
  <link data-trunk rel="rust" data-bin="figcraft-web" data-cargo-profile="web-release" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue --enable-simd" data-weak-refs />
  <style>
    /* Greenfield ground and ink (docs/brand/README.md). The editor's own theme takes over once the
       page has started; until then the page follows the system setting. */
    :root { --ground: #f3f0e8; --ink: #14150f; --body: #55534c; }
    @media (prefers-color-scheme: dark) { :root { --ground: #0b0c0a; --ink: #ece8de; --body: #b9b5ac; } }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--ground); }
    #figcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #figcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      color: var(--body); font: 12px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0.1em; text-transform: uppercase; pointer-events: none; }
    /* The mark is a 16-cell grid: 64 px is four pixels per cell. */
    #figcraft_loading img { width: 64px; height: 64px; image-rendering: pixelated; }
    /* Shown once the page stopped on an internal error (web.rs: show_stopped). */
    #figcraft_stopped { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
      padding: 16px; text-align: center; color: var(--ink); background: var(--ground); font: 14px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="figcraft_canvas"></canvas>
  <div id="figcraft_loading">
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="greenfield-mark-small.svg">
      <img src="greenfield-mark-small-on-light.svg" alt="">
    </picture>
    <span>Loading Greenfield&hellip;</span>
  </div>
</body>
</html>
